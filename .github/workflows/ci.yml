name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Placeholders so the build can evaluate db/drizzle.ts and lib/stripe.ts.
          # No database or Stripe API is contacted during a build.
          DATABASE_URL: postgresql://user:password@localhost:5432/lingo?sslmode=require
          STRIPE_API_SECRET_KEY: sk_test_ci_placeholder
